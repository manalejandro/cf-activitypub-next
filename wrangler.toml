name = "cf-activitypub"
main = "src/worker.ts"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]
# vinext + @cloudflare/vite-plugin: `vite build` emits the static client into
# dist/client (and the worker into dist/server); the plugin generates the deploy
# config from this one, so the directory must be the build output, not the old
# OpenNext one. `not_found_handling = "none"` keeps the worker on the hook for
# every route (the app, not a static 404 page, answers).
assets = { directory = "dist/client", not_found_handling = "none", binding = "ASSETS" }

# Guardian vector memory (Cloudflare Vectorize). OPTIONAL — the moderation
# system works without it; this adds semantic spam detection + RAG precedent.
# Enable it by creating the index and uncommenting the binding below:
#   npx wrangler vectorize create moderation-vectors --dimensions=1024 --metric=cosine
# (1024 dims to match the @cf/baai/bge-m3 embedding model used by lib/moderation/vectors.ts)
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "moderation-vectors"

[[routes]]
pattern = "cf-ap.example.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "cf-activitypub"
database_id = ""

[[kv_namespaces]]
binding = "KV"
id = ""

[[r2_buckets]]
binding = "R2"
bucket_name = "cf-activitypub-media"

# Email Workers binding for sending verification/notification emails.
# Requires Email Routing to be enabled on your Cloudflare zone.
# Docs: https://developers.cloudflare.com/email-routing/email-workers/send-email-workers/
[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "cf-activitypub-delivery"

[[queues.consumers]]
queue = "cf-activitypub-delivery"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 16
dead_letter_queue = "cf-activitypub-delivery-dlq"

# Dead-letter queue: failures past max_retries land here. The worker records
# them (KV, 30 days) and acks so the DLQ doesn't grow unbounded.
[[queues.consumers]]
queue = "cf-activitypub-delivery-dlq"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 0

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TIMELINE_STREAM"
class_name = "TimelineStreamDO"

[[durable_objects.bindings]]
name = "CALL_SIGNALING"
class_name = "CallSignalingDO"

# The Guardian's Cloudflare Agent (Agents SDK). `AIChatAgent` persists the
# conversation in the object's SQLite, so it needs a `new_sqlite_classes`
# migration — never add it to the existing tag: migrations are immutable once
# deployed.
[[durable_objects.bindings]]
name = "GuardianAgent"
class_name = "GuardianAgentDO"

[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TimelineStreamDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallSignalingDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["GuardianAgentDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["RateLimitDO"]

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

[dev]
port = 3000
local_protocol = "http"
