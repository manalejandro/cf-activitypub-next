name = "cf-activitypub"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[vars]
INSTANCE_TITLE = "CF ActivityPub"
INSTANCE_DESCRIPTION = "A federated social network powered by ActivityPub and Cloudflare"
INSTANCE_VERSION = "1.2.0"
INSTANCE_URL = "https://cf-ap.example.com"
NODE_ENV = "production"
VAPID_PUBLIC_KEY = ""
VAPID_EMAIL = "mailto:admin@cf-ap.example.com"
# Public Turnstile site key (replace with your actual key from dash.cloudflare.com/turnstile)
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
# Sender address — must belong to a domain with Cloudflare Email Routing enabled
FROM_EMAIL = "noreply@cf-ap.example.com"
# LibreTranslate instance URL (set to empty to disable translation)
LIBRETRANSLATE_URL = ""
# Global daily AI budget for the Guardian (abstract units/day; 0 = unlimited).
# Charge per call: guard screen = 1, vision alt-text = 5, 70B reason = 25.
# Cloudflare free ~10k neurons/day — tune this to your plan's allowance.
AI_DAILY_BUDGET = "1000"
# Secrets: set with wrangler secret put
#   wrangler secret put TURNSTILE_SECRET
#   wrangler secret put CALLS_TURN_KEY_ID
#   wrangler secret put CALLS_API_TOKEN
#   wrangler secret put ADMIN_TOKEN  (optional — if set, admin endpoints require it)

# ── Instance limit overrides ──────────────────────────────────────────────
# Every limit in lib/constants.ts can be overridden with a homonymous var
# (e.g. `MAX_STATUS_CHARS = "1000"`). The API enforces the effective values
# and reports them via /api/v1/instance `limits` + `configuration`, which the
# web client reads, so limits stay consistent end-to-end.
# Available names (see lib/constants.ts): MAX_STATUS_CHARS, MAX_CW_CHARS,
# MAX_ALT_TEXT_CHARS, MAX_MEDIA_ATTACHMENTS, MAX_POLL_OPTIONS,
# MAX_POLL_OPTION_CHARS, POLL_MIN_EXPIRATION, POLL_MAX_EXPIRATION,
# MAX_FEATURED_TAGS, CHARACTERS_RESERVED_PER_URL, MAX_PROFILE_FIELDS,
# MAX_PROFILE_FIELD_CHARS, MAX_DISPLAY_NAME_CHARS, MAX_NOTE_CHARS,
# MAX_EMOJI_SHORTCODE_CHARS, MAX_FEATURED_TAG_NAME_CHARS,
# MAX_COLLECTION_NAME_CHARS, MAX_COLLECTION_DESCRIPTION_CHARS,
# MAX_ANNOUNCEMENT_CHARS, MAX_LANG_CODE_CHARS, PAGE_SIZE,
# DEFAULT_TIMELINE_PAGE, MAX_PAGE_SIZE, MAX_COLLECTION_PAGE,
# TRENDING_TAGS_LIMIT, TRENDING_TAGS_MAX, ADMIN_LOG_PAGE_SIZE,
# MAX_IMAGE_SIZE, MAX_VIDEO_SIZE, IMAGE_MATRIX_LIMIT, VIDEO_FRAME_RATE_LIMIT,
# VIDEO_MATRIX_LIMIT.

# Guardian vector memory (Cloudflare Vectorize). OPTIONAL — the moderation
# system works without it; this adds semantic spam detection + RAG precedent.
# Enable it by creating the index and uncommenting the binding below:
#   npx wrangler vectorize create moderation-vectors --dimensions=1024 --metric=cosine
# (1024 dims to match the @cf/baai/bge-m3 embedding model used by lib/moderation/vectors.ts)
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "moderation-vectors"

[[routes]]
pattern = "cf-ap.example.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "cf-activitypub"
database_id = ""

[[kv_namespaces]]
binding = "KV"
id = ""

[[r2_buckets]]
binding = "R2"
bucket_name = "cf-activitypub-media"

# Email Workers binding for sending verification/notification emails.
# Requires Email Routing to be enabled on your Cloudflare zone.
# Docs: https://developers.cloudflare.com/email-routing/email-workers/send-email-workers/
[[send_email]]
name = "EMAIL"

[[queues.producers]]
binding = "DELIVERY_QUEUE"
queue = "cf-activitypub-delivery"

[[queues.consumers]]
queue = "cf-activitypub-delivery"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "cf-activitypub-delivery-dlq"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TIMELINE_STREAM"
class_name = "TimelineStreamDO"

[[durable_objects.bindings]]
name = "CALL_SIGNALING"
class_name = "CallSignalingDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TimelineStreamDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallSignalingDO"]

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

[dev]
port = 3000
local_protocol = "http"
