<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="CF ActivityPub">
  <title>CF ActivityPub</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="net" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hexagonal badge (rounded corners faked with a round-joined stroke) -->
  <polygon points="60,11 101,34 101,86 60,109 19,86 19,34"
           fill="url(#badge)" stroke="url(#badge)" stroke-width="10" stroke-linejoin="round"/>
  <polygon points="60,11 101,34 101,86 60,109 19,86 19,34" fill="url(#sheen)"/>

  <!-- Federation cloud: nodes joined like a network. The instance node (the
       pulsing one) sits exactly on the hexagon's centre, the graph moves with it. -->
  <g stroke="url(#net)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M38 78 L60 78 L82 78 L92 62 L78 44 L58 36 L38 44 L28 62 Z"/>
    <path d="M60 60 L60 78"/>
    <path d="M60 60 L58 36"/>
    <path d="M60 60 L92 62"/>
    <path d="M60 60 L38 44"/>
  </g>

  <!-- Nodes -->
  <g fill="#ffffff">
    <circle cx="38" cy="78" r="3.6"/>
    <circle cx="60" cy="78" r="3.6"/>
    <circle cx="82" cy="78" r="3.6"/>
    <circle cx="92" cy="62" r="3.6"/>
    <circle cx="58" cy="36" r="3.6"/>
    <circle cx="38" cy="44" r="3.6"/>
    <circle cx="28" cy="62" r="3.6"/>
  </g>
  <!-- Warm node: the Cloudflare side of the stack -->
  <circle cx="78" cy="44" r="3.8" fill="#fdba74"/>

  <!-- Instance node with activity pulse, at the hexagon's centre (60,60) -->
  <circle cx="60" cy="60" r="15" fill="#ffffff" opacity="0.12"/>
  <circle cx="60" cy="60" r="10.5" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.35"/>
  <circle cx="60" cy="60" r="6.4" fill="#ffffff"/>
</svg>
